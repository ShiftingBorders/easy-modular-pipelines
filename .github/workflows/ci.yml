name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install pinned SeaweedFS
        run: uv run python scripts/download_seaweedfs.py

      - name: Run Ruff
        run: uv run --with ruff ruff check core tests scripts

      - name: Compile Python sources
        run: uv run python -m compileall core scripts

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: Upload failed-test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: .artifacts/ci-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
